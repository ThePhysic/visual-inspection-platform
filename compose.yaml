services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment: &backend-environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_ALLOWED_HOSTS: 127.0.0.1,localhost,[::1],api,web
      API_PORT: "3001"
      MONGODB_URI: mongodb://mongodb:27017/visual_inspection
      REDIS_URL: redis://redis:6379
      ASSET_STORAGE_DIR: /data/images
      API_OPERATOR_PORT: "9464"
    volumes:
      - images:/data/images
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/ready', {signal: AbortSignal.timeout(2000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      <<: *backend-environment
      WORKER_HEALTH_FILE: /tmp/vip-worker-health.json
      WORKER_OPERATOR_PORT: "9465"
    volumes:
      - images:/data/images:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Expiring local observation of DB/queue connections and bounded active work.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('node:fs').readFileSync('/tmp/vip-worker-health.json')); if(!s.healthy || Date.now()-s.observedAt>15000 || s.observedAt>Date.now()+1000) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 45s

  mongodb:
    image: mongo:8.0.34
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.2.8
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongodb-data:
  redis-data:
  images:
