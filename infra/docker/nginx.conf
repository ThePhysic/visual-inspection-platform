map $host $vip_local_host {
    default 0;
    localhost 1;
    127.0.0.1 1;
    [::1] 1;
    web 1;
    api 1;
}

# Exclude query strings from routine access logs; retain upstream correlation.
log_format vip_local '$remote_addr "$request_method $uri" $status '
                     '$body_bytes_sent $request_time "$sent_http_x_request_id"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout vip_local;
    if ($vip_local_host = 0) { return 421; }
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Includes multipart overhead; the API remains authoritative at 10 MiB/file.
    client_max_body_size 11m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Resolve Docker's service address again after API container recreation.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api http://api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        # Preserve the browser-facing port for the API's same-origin comparison.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_intercept_errors off;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
