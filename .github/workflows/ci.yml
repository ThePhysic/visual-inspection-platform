name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Runner kernel diagnostics
        shell: bash
        run: |
          uname -r
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    # OS label only, not a kernel pin. Runtime allocator assertions below remain
    # required as GitHub updates the host kernel independently of this label.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Job-level services start before steps, suppressing diagnostics if MongoDB
      # cannot start. The wrapper now starts the same real services explicitly.
      - name: Runner and Docker kernel diagnostics before service startup
        run: |
          uname -r
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker info --format 'Docker kernel: {{.KernelVersion}}'
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vip/web exec playwright install --with-deps chromium
      # No tests skipped: wrapper runs pnpm test:integration + pnpm test:e2e
      # against owned MongoDB 8.0.34/Redis containers with compose.ci.yaml.
      - run: pnpm test:ci:integration

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner and Docker kernel diagnostics before service startup
        run: |
          uname -r
          printf 'Runner image: %s %s\n' "$ImageOS" "$ImageVersion"
          docker info --format 'Docker kernel: {{.KernelVersion}}'
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet
      - run: pnpm --filter @vip/web exec playwright install --with-deps chromium
      # Existing smoke/browser checks plus bounded dependency interruptions.
      # Generates its own project/ownership labels; guarded finally cleanup.
      # Native integration/e2e coverage remains in the integration job above.
      - name: Isolated container reliability and browser smoke
        run: pnpm test:reliability --browser --ci-mongodb
      # Correctness smoke only: no latency thresholds or heavy PR load test.
      - name: Bounded isolated benchmark harness smoke
        timeout-minutes: 4
        run: pnpm benchmark --count 2 --concurrency 2 --history-size 200 --history-samples 2 --duration-ms 60000 --ci-mongodb
